name: Stillness
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID
targets:
  Stillness:
    type: application
    platform: iOS
    sources: [App]
    entitlements:
      path: App/Stillness.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.stillness]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stillness
        UILaunchScreen: {UIColorName: ""}
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes: [whatsapp, googlegmail, chatgpt, claude, google, weather, tel, message, mailto]
    dependencies:
      - target: ShieldConfig
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources: [Shield, App/Shared.swift]
    entitlements:
      path: Shield/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.stillness]
    info:
      path: Shield/Info.plist
      properties:
        CFBundleDisplayName: StillnessShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
